name: Uppdatera statslåneränta

on:
  schedule:
    - cron: "23 5 * * 5"   # fredag morgon, efter torsdagens fastställande
    - cron: "23 5 * * 1"   # måndag, reserv
  workflow_dispatch:        # kör manuellt under Actions -> Run workflow

permissions:
  contents: write
  pages: write

concurrency:
  group: statslaneranta
  cancel-in-progress: false

env:
  SLR_PATH: slr.json        # ändra om bolånekalkylen ligger i en undermapp, t.ex. docs/slr.json

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta från Riksgälden
        run: python scripts/hamta_slr.py "$SLR_PATH"

      - name: Spara om räntan ändrats
        id: commit
        run: |
          git add "$SLR_PATH"
          if git diff --cached --quiet; then
            echo "Ingen ny statslåneränta."
            echo "andrad=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATUM=$(python -c "import json,os;print(json.load(open(os.environ['SLR_PATH']))['senaste']['datum'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Statslåneränta $DATUM"
          git push
          echo "andrad=true" >> "$GITHUB_OUTPUT"

      # Pushar från GITHUB_TOKEN startar inte GitHub Pages av sig själva.
      - name: Bygg om GitHub Pages
        if: steps.commit.outputs.andrad == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
